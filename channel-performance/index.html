*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<!-- DATA_INJECTION_POINT -->

<script>
// ── STATE ────────────────────────────────────────────────────────────────
let mode = 'month';               // 'month' | 'week'
let selectedPeriods = [];         // array of period keys consumed by render() —
                                   // month mode: pill-toggle array (up to 3);
                                   // week mode: mirrors the 3 dropdown values
let expandedPeriod = {};          // { "channel|periodKey": bool } — expands that row's source/medium breakdown
let searchTerm = '';

// Per direct instruction: up to 3 months via pills, exactly 3 weeks via
// 3 dedicated dropdowns, selected freely from the full available list
// (Jan 2026 onward), compared pairwise.
const MAX_SELECT = { month: 3 };
const WEEK_DROPDOWN_COUNT = 3;

// ── INIT ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (typeof CP === 'undefined') {
    document.getElementById('asOfBadge').textContent = 'No data injected — run scripts/build_channel_performance.py';
    document.getElementById('loading').classList.add('hide');
    return;
  }
  document.getElementById('asOfBadge').textContent = 'Data as of ' + CP.asOfDate;
  document.getElementById('sbPropId').textContent = CP.propertyId || '368188880';
  setupModePills();
  resetMonthSelection();
  renderPeriodPills();
  setupSearch();
  render();
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 900);
});

function setupModePills() {
  document.querySelectorAll('#modePills .pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('#modePills .pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      mode = p.dataset.mode;
      document.getElementById('periodPickerBarMonth').style.display = mode === 'month' ? 'flex' : 'none';
      document.getElementById('periodPickerBarWeek').style.display = mode === 'week' ? 'flex' : 'none';
      if (mode === 'month') {
        resetMonthSelection();
        renderPeriodPills();
      } else {
        resetWeekSelection();
        renderWeekDropdowns();
      }
      render();
    });
  });
}

function periodSet() {
  return mode === 'month' ? CP.months : CP.weeks;
}
function trafficSet() {
  return mode === 'month' ? CP.monthlyTraffic : CP.weeklyTraffic;
}
function conversionsSet() {
  return (mode === 'month' ? CP.monthlyConversions : CP.weeklyConversions) || {};
}

function resetMonthSelection() {
  const keys = CP.months.keys;
  selectedPeriods = keys.length ? [keys[keys.length - 1]] : [];
}

// Clamped "N weeks before" a given index into CP.weeks.keys — never goes
// past the earliest available week (early in the data history there may
// not be 3 distinct weeks yet, in which case earlier slots repeat the
// earliest week rather than erroring).
function weekIndexBefore(idx, n) {
  return Math.max(0, idx - n);
}

// Initial load / switching into Week mode: dropdown 1 = latest week,
// dropdown 2 = the week before it, dropdown 3 = blank — per direct
// instruction. After this, only the 1→2 cascade re-fires on user
// interaction (see weekDropdownChanged); dropdown 3 stays whatever the
// user leaves it at, including blank.
function resetWeekSelection() {
  const keys = CP.weeks.keys;
  if (!keys.length) { selectedPeriods = []; return; }
  const lastIdx = keys.length - 1;
  selectedPeriods = [
    keys[lastIdx],
    keys[weekIndexBefore(lastIdx, 1)],
    '',   // blank by default — a 3rd week is optional, not forced
  ];
}

function renderWeekDropdowns() {
  const keys = CP.weeks.keys;
  const labels = CP.weeks.labels;
  for (let i = 0; i < WEEK_DROPDOWN_COUNT; i++) {
    const sel = document.getElementById('weekSelect' + i);
    sel.innerHTML = '';
    if (i === 2) {
      // Only the 3rd dropdown may be blank — dropdowns 1 and 2 always
      // carry a real week.
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = '— None —';
      if (!selectedPeriods[i]) blank.selected = true;
      sel.appendChild(blank);
    }
    keys.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = labels[k];
      if (k === selectedPeriods[i]) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => weekDropdownChanged(i, sel.value);
  }
}

// Only dropdown 1 (index 0) cascades a default into dropdown 2 (index 1),
// per direct instruction — dropdown 3 is always independent, whether it
// was reached via cascade-on-load or is being changed directly here.
function weekDropdownChanged(i, value) {
  selectedPeriods[i] = value;
  if (i === 0) {
    const keys = CP.weeks.keys;
    const idx = keys.indexOf(value);
    selectedPeriods[1] = keys[weekIndexBefore(idx, 1)];
    renderWeekDropdowns();
  }
  render();
}

// Selected periods in chronological order (ascending), for consistent
// column ordering and for "older -> newer" delta direction. Filters out
// the blank 3rd-week slot (Week mode's dropdown 3 defaults to blank).
function sortedSelected() {
  const keys = periodSet().keys;
  return selectedPeriods.filter(Boolean).slice().sort((a, b) => keys.indexOf(a) - keys.indexOf(b));
}

function renderPeriodPills() {
  const set = periodSet();
  const max = MAX_SELECT.month;
  document.getElementById('periodPickerLabel').textContent = 'SELECT MONTHS';
  const wrap = document.getElementById('periodPills');
  wrap.innerHTML = '';
  set.keys.forEach(k => {
    const pill = document.createElement('span');
    const isActive = selectedPeriods.includes(k);
    const atCap = !isActive && selectedPeriods.length >= max;
    pill.className = 'period-pill' + (isActive ? ' active' : '') + (atCap ? ' disabled' : '');
    pill.textContent = set.labels[k];
    pill.title = atCap ? `Up to ${max} selected — deselect one first` : '';
    pill.addEventListener('click', () => {
      if (isActive) {
        selectedPeriods = selectedPeriods.filter(x => x !== k);
        if (!selectedPeriods.length) selectedPeriods = [k]; // never allow zero selected
      } else if (!atCap) {
        selectedPeriods.push(k);
      } else {
        return;
      }
      renderPeriodPills();
      render();
    });
    wrap.appendChild(pill);
  });
}

function setupSearch() {
  document.getElementById('btnSearch').addEventListener('click', () => {
    searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    Object.keys(expandedPeriod).forEach(k => delete expandedPeriod[k]);
    render();
  });
  document.getElementById('btnClear').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    searchTerm = '';
    render();
  });
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnSearch').click();
  });
}

// ── FORMATTING ───────────────────────────────────────────────────────────
function fmtInt(n) { return (n || 0).toLocaleString('en-US'); }

// Threshold rule, per direct instruction: >=3% increase green, <=-3% decrease
// red, everything else (including the ±2% "neutral" zone and the
// unspecified 2-3% gap in the original spec) renders neutral gray.
function deltaBadge(curr, prev) {
  if (prev === 0 && curr === 0) return '';
  if (prev === 0) return `<span class="delta-badge delta-new">new</span>`;
  const pct = (curr - prev) / prev * 100;
  let cls = 'delta-neu';
  if (pct >= 3) cls = 'delta-pos';
  else if (pct <= -3) cls = 'delta-neg';
  const sign = pct >= 0 ? '+' : '';
  return `<span class="delta-badge ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function highlight(text) {
  if (!searchTerm) return text;
  const idx = text.toLowerCase().indexOf(searchTerm);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + searchTerm.length) + '</mark>' + text.slice(idx + searchTerm.length);
}

// ── FREE/PAID HELPERS ────────────────────────────────────────────────────
function pctStr(numer, denom) {
  if (!denom) return '—';
  return (numer / denom * 100).toFixed(2) + '%';
}
function convFor(conv, channel, key) {
  const c = (conv[channel] || {})[key];
  return c ? { free: c.free || 0, paid: c.paid || 0 } : { free: 0, paid: 0 };
}
// ── RENDER ───────────────────────────────────────────────────────────────
// Layout: channel rows, each expanding to one row per selected period
// (chronological), each of which expands further to its top source/medium
// breakdown. A single selected period collapses this to the simple
// classic view — one row per channel, no separate period level.
function render() {
  const set = periodSet();
  if (!set.keys.length) return;
  const periods = sortedSelected();
  const k = periods.length;

  const traffic = trafficSet();
  const conv = conversionsSet();
  const tbody = document.getElementById('tbodyChannels');
  tbody.innerHTML = '';

  let anyMatch = false;
  let matchCount = 0;

  const convAvailable = !CP.conversionsUnavailable;

  function metricCells(trafficVal, prevTrafficVal, freeVal, prevFreeVal, paidVal, prevPaidVal, trafficAvailable) {
    return `
      <td class="num-cell${trafficAvailable ? '' : ' pending-cell'}">${trafficAvailable ? fmtInt(trafficVal) : '—'}</td>
      <td class="num-cell">${trafficAvailable && prevTrafficVal !== null ? deltaBadge(trafficVal, prevTrafficVal) : ''}</td>
      <td class="num-cell${convAvailable ? '' : ' pending-cell'}">${convAvailable ? fmtInt(freeVal) : '—'}</td>
      <td class="num-cell">${convAvailable && prevFreeVal !== null ? deltaBadge(freeVal, prevFreeVal) : ''}</td>
      <td class="num-cell${convAvailable ? '' : ' pending-cell'}">${convAvailable ? fmtInt(paidVal) : '—'}</td>
      <td class="num-cell">${convAvailable && prevPaidVal !== null ? deltaBadge(paidVal, prevPaidVal) : ''}</td>
      <td class="num-cell">${trafficAvailable && convAvailable ? pctStr(freeVal, trafficVal) : '—'}</td>
      <td class="num-cell">${convAvailable ? pctStr(paidVal, freeVal) : '—'}</td>
    `;
  }

  function renderSourceRows(channel, period, rows) {
    const filtered = searchTerm ? rows.filter(r => r.sm.toLowerCase().includes(searchTerm)) : rows;
    const sorted = filtered.slice().sort((a, b) => (b.byPeriod[period] || 0) - (a.byPeriod[period] || 0));
    const top = sorted.slice(0, 20);
    const rest = sorted.slice(20);
    top.forEach(r => {
      const tr = document.createElement('tr');
      tr.className = 'sub-row sub-row-l2' + (searchTerm && r.sm.toLowerCase().includes(searchTerm) ? ' match-highlight' : '');
      tr.innerHTML = `
        <td></td><td class="sub-name sub-name-l2">${highlight(r.sm)}</td>
        <td class="num-cell">${fmtInt(r.byPeriod[period] || 0)}</td><td class="num-cell"></td>
        <td class="num-cell pending-cell">—</td><td class="num-cell pending-cell">—</td>
        <td class="num-cell pending-cell">—</td><td class="num-cell pending-cell">—</td>
        <td class="num-cell pending-cell">—</td><td class="num-cell pending-cell">—</td>
      `;
      tbody.appendChild(tr);
    });
    const restTotal = rest.reduce((a, r) => a + (r.byPeriod[period] || 0), 0);
    if (rest.length && restTotal > 0) {
      const tr = document.createElement('tr');
      tr.className = 'sub-row sub-row-l2';
      tr.innerHTML = `
        <td></td><td class="sub-name sub-name-l2">Other (${rest.length} sources)</td>
        <td class="num-cell">${fmtInt(restTotal)}</td><td class="num-cell"></td>
        <td class="num-cell pending-cell">—</td><td class="num-cell pending-cell">—</td>
        <td class="num-cell pending-cell">—</td><td class="num-cell pending-cell">—</td>
        <td class="num-cell pending-cell">—</td><td class="num-cell pending-cell">—</td>
      `;
      tbody.appendChild(tr);
    }
  }

  // One row for a single (channel, period) combination. `nested` = true
  // renders it as an indented period row under a channel group header;
  // false renders it as the plain top-level row (the k===1 case).
  function renderPeriodRow(channel, period, rows, trafficAvailable, prevPeriod, nested, extraClass) {
    const key = channel + '|' + period;
    const isOpen = trafficAvailable && (!!expandedPeriod[key] || !!searchTerm);
    const trafficVal = trafficAvailable ? rows.reduce((a, r) => a + (r.byPeriod[period] || 0), 0) : null;
    const prevTrafficVal = (trafficAvailable && prevPeriod != null)
      ? rows.reduce((a, r) => a + (r.byPeriod[prevPeriod] || 0), 0) : null;
    const cConv = convFor(conv, channel, period);
    const pConv = prevPeriod != null ? convFor(conv, channel, prevPeriod) : null;

    const tr = document.createElement('tr');
    tr.className = (trafficAvailable ? 'channel-row' : '') + (extraClass ? ' ' + extraClass : '');
    const nameCell = nested
      ? `<td class="sub-name sub-name-l1">${set.labels[period]}</td>`
      : `<td class="channel-name">${highlight(channel)}</td>`;
    tr.innerHTML = `
      <td>${trafficAvailable ? `<span class="expand-icon">${isOpen ? '−' : '+'}</span>` : ''}</td>
      ${nameCell}
      ${metricCells(trafficVal, prevTrafficVal, cConv.free, pConv ? pConv.free : null, cConv.paid, pConv ? pConv.paid : null, trafficAvailable)}
    `;
    if (trafficAvailable) tr.addEventListener('click', () => { expandedPeriod[key] = !expandedPeriod[key]; render(); });
    tbody.appendChild(tr);
    if (isOpen) renderSourceRows(channel, period, rows);
  }

  function renderChannel(channel, rows, trafficAvailable, extraClass) {
    if (k === 1) {
      renderPeriodRow(channel, periods[0], rows, trafficAvailable, null, false, extraClass);
      return;
    }
    const header = document.createElement('tr');
    header.className = 'channel-group-row' + (extraClass ? ' ' + extraClass : '');
    header.innerHTML = `<td></td><td class="channel-name" colspan="9">${highlight(channel)}</td>`;
    tbody.appendChild(header);
    periods.forEach((p, i) => {
      renderPeriodRow(channel, p, rows, trafficAvailable, i > 0 ? periods[i - 1] : null, true, extraClass);
    });
  }

  CP.channelOrder.forEach(channel => {
    const smMap = traffic[channel] || {};
    const rows = Object.entries(smMap).map(([sm, perPeriod]) => ({ sm, byPeriod: perPeriod }));

    let matchingRows = rows;
    if (searchTerm) {
      matchingRows = rows.filter(r => r.sm.toLowerCase().includes(searchTerm));
      const channelMatches = matchingRows.length > 0 || channel.toLowerCase().includes(searchTerm);
      if (!channelMatches) return;
      anyMatch = true;
      matchCount += matchingRows.length;
    }
    const anyTraffic = periods.some(p => rows.reduce((a, r) => a + (r.byPeriod[p] || 0), 0) > 0);
    const anyConv = periods.some(p => { const c = convFor(conv, channel, p); return c.free || c.paid; });
    if (!anyTraffic && !anyConv && !searchTerm) return;

    renderChannel(channel, rows, true, channel === 'Unassigned' ? 'unassigned-row' : null);
  });

  // "Other (Unclassified)" — conversion titles the classifier couldn't place
  // into any real GA4 channel. Not GA4 traffic, so Traffic/Δ show as "—".
  if (!searchTerm) {
    const OTHER = 'Other (Unclassified)';
    const anyOtherData = periods.some(p => { const c = convFor(conv, OTHER, p); return c.free || c.paid; });
    if (anyOtherData) renderChannel(OTHER, [], false, 'unassigned-row');
  }

  const statusEl = document.getElementById('searchStatus');
  if (searchTerm) {
    statusEl.textContent = anyMatch ? `${matchCount} match(es) found` : `No source/medium matching "${searchTerm}" found.`;
  } else {
    statusEl.textContent = '';
  }
}
</script>
</body>
</html>
